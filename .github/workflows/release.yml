name: Verify the Fast NRI skill editor
on:
  create:
permissions:
  contents: read
jobs:
  regression:
    if: github.event.ref_type == 'branch' && github.event.ref == 'checks/skill-pool-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release gate
        run: bash tests/release-gate.sh
      - name: Compile and verify LevelDB compendiums
        run: |
          npm install --no-save --no-audit --no-fund handlebars
          npm run build:packs
      - name: Run browser tests
        run: |
          set -euo pipefail
          python -m pip install playwright beautifulsoup4
          if [[ ! -x /usr/bin/chromium ]]; then
            if command -v google-chrome; then
              sudo ln -s "$(command -v google-chrome)" /usr/bin/chromium
            else
              python -m playwright install --with-deps chromium
              browser="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
              sudo ln -s "$browser" /usr/bin/chromium
            fi
          fi
          failed=0
          for file in tests/skill-allocation-browser-test.py tests/*browser-test.py; do
            if [[ "$file" == tests/skill-allocation-browser-test.py && "${checked_skill:-}" == 1 ]]; then continue; fi
            if [[ "$file" == tests/skill-allocation-browser-test.py ]]; then checked_skill=1; fi
            printf '\n== %s ==\n' "$file"
            python "$file" || failed=1
          done
          exit "$failed"
      - name: Validate manifest and package compiled system compendiums
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('.')
          manifest = json.loads((root / 'system.json').read_text(encoding='utf-8'))
          assert manifest['id'] == 'fast-nri-v14'
          assert manifest['download'].endswith(f"/v{manifest['version']}/fast-nri-v14.zip")
          files = [pathlib.Path('system.json')]
          files += [pathlib.Path(p) for p in manifest['esmodules']]
          files += [pathlib.Path(p) for p in manifest['styles']]
          files += [pathlib.Path(lang['path']) for lang in manifest['languages']]
          for pack in manifest['packs']:
              assert pack['type'] in ('Item','Actor') and pack['system'] == manifest['id']
              assert pack['path'] == 'packs/' + pack['name']
              entries = [p for p in pathlib.Path(pack['path']).rglob('*') if p.is_file()]
              assert entries, f"No built files in {pack['path']}"
              files += entries
          for folder in ('module','templates'):
              files += [p for p in pathlib.Path(folder).rglob('*') if p.is_file()]
          files = sorted(set(files))
          assert all(p.is_file() and '..' not in p.parts for p in files)
          pathlib.Path('dist').mkdir(exist_ok=True)
          with zipfile.ZipFile('dist/fast-nri-v14.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,'fast-nri-v14/'+p.as_posix())
          with zipfile.ZipFile('dist/fast-nri-v14.zip') as z:
              assert z.testzip() is None
          print(f"Packaged {len(files)} runtime files")
          PY
          sha256sum dist/fast-nri-v14.zip
      - name: Upload the test installer
        uses: actions/upload-artifact@v4
        with:
          name: fast-nri-skill-editor-test
          path: dist/fast-nri-v14.zip
          if-no-files-found: error
