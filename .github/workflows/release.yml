name: Validate character sheet corrections
on:
  create:
permissions:
  contents: read
jobs:
  regression:
    if: github.event.ref_type == 'branch' && github.event.ref == 'checks/character-sheet-playtest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release gate
        run: bash tests/release-gate.sh
      - name: Compile and verify LevelDB compendiums
        run: |
          npm install --no-save --no-audit --no-fund handlebars
          npm run build:packs
      - name: Run browser tests
        run: |
          set -euo pipefail
          python -m pip install playwright beautifulsoup4
          if [[ ! -x /usr/bin/chromium ]]; then
            if command -v google-chrome; then
              sudo ln -s "$(command -v google-chrome)" /usr/bin/chromium
            else
              python -m playwright install --with-deps chromium
              browser="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
              sudo ln -s "$browser" /usr/bin/chromium
            fi
          fi
          for file in tests/*browser-test.py; do
            printf '\n== %s ==\n' "$file"
            python "$file"
          done
