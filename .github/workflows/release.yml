name: Verify Fast NRI racial composition (no publication)
on:
  create:
permissions:
  contents: read
jobs:
  regression:
    if: github.event.ref_type == 'branch' && github.event.ref == 'checks/racial-composition-0.2.0.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release gate
        run: bash tests/release-gate.sh
