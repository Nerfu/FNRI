name: Package and publish Foundry system

# Explicit release request only. Ordinary commits and pushes to main never
# publish. Assistant may request a release by creating release/vVERSION
# at the audited HEAD of main; users may use workflow_dispatch.
on:
  create:
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'User explicitly approved this release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fnri-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release_approved == true && github.ref == 'refs/heads/main') ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify explicit release request and exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_EVENT: ${{ github.event_name }}
          REQUEST_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("system.json"))["version"])')"
          if [[ "$REQUEST_EVENT" == 'create' ]]; then
            if [[ "$REQUEST_REF" != "release/v${version}" ]]; then
              echo "::error::Release branch must be release/v${version}"
              exit 1
            fi
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Release must use the audited exact main commit"
            exit 1
          fi
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v${version} already exists"
            exit 1
          fi
      - name: Run the same test gate as local pre-release
        shell: bash
        run: bash tests/release-gate.sh
      - name: Validate manifest and package system-only files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('.')
          manifest = json.loads((root / 'system.json').read_text(encoding='utf-8'))
          assert manifest['id'] == 'fast-nri-v14'
          assert manifest['download'].endswith(f"/v{manifest['version']}/fast-nri-v14.zip")
          files = [pathlib.Path('system.json')]
          files += [pathlib.Path(p) for p in manifest['esmodules']]
          files += [pathlib.Path(p) for p in manifest['styles']]
          files += [pathlib.Path(lang['path']) for lang in manifest['languages']]
          for folder in ('module','templates'):
              files += [p for p in pathlib.Path(folder).rglob('*') if p.is_file()]
          files = sorted(set(files))
          assert all(p.is_file() and '..' not in p.parts for p in files)
          pathlib.Path('dist').mkdir(exist_ok=True)
          with zipfile.ZipFile('dist/fast-nri-v14.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,'fast-nri-v14/'+p.as_posix())
          with zipfile.ZipFile('dist/fast-nri-v14.zip') as z:
              assert z.testzip() is None
          print(f"Packaged {len(files)} runtime files")
          PY
          sha256sum dist/fast-nri-v14.zip
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("system.json"))["version"])')"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$tag" dist/fast-nri-v14.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fast NRI 7.0 — $tag (Foundry 14)" \
            --notes 'Foundry v14 build; see CHANGELOG for implementation notes.' \
            --prerelease
