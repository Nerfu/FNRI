name: Package and publish Foundry system

# Explicit manual release only. A normal push to main must never create a
# release or send CI failure notifications during code review.
on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'User explicitly approved this release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ inputs.release_approved == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: 'Validate v0.1.10: Foundry 14 effects, persistence and rolls'
        shell: bash
        run: |
          find . -name '*.mjs' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node tests/bootstrap-smoke.mjs
          node tests/stage3-rolls.mjs
          node tests/stage3-actions.mjs
          node tests/catalog-reload.mjs
          python3 tests/contract_check.py
      - name: Validate manifest and package system-only files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('.')
          manifest = json.loads((root / 'system.json').read_text(encoding='utf-8'))
          assert manifest['id'] == 'fast-nri-v14'
          assert manifest['download'].endswith(f"/v{manifest['version']}/fast-nri-v14.zip")
          files = [pathlib.Path('system.json')]
          files += [pathlib.Path(p) for p in manifest['esmodules']]
          files += [pathlib.Path(p) for p in manifest['styles']]
          files += [pathlib.Path(lang['path']) for lang in manifest['languages']]
          for folder in ('module','templates'):
              files += [p for p in pathlib.Path(folder).rglob('*') if p.is_file()]
          files = sorted(set(files))
          assert all(p.is_file() and '..' not in p.parts for p in files)
          pathlib.Path('dist').mkdir(exist_ok=True)
          with zipfile.ZipFile('dist/fast-nri-v14.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,'fast-nri-v14/'+p.as_posix())
          with zipfile.ZipFile('dist/fast-nri-v14.zip') as z:
              assert z.testzip() is None
          print(f"Packaged {len(files)} runtime files")
          PY
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("system.json"))["version"])')"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 0
          fi
          gh release create "$tag" dist/fast-nri-v14.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fast NRI 7.0 — $tag (Foundry 14)" \
            --notes 'Foundry v14 build; see CHANGELOG for implementation notes.' \
            --prerelease
