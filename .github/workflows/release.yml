name: Repair the Fast NRI v0.2.0 installer
on:
  create:

permissions:
  contents: write

concurrency:
  group: fnri-publish
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.event.ref_type == 'branch' && github.event.ref == 'maintenance/v0.2.0-packs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the repair changes only the build script
        shell: bash
        run: |
          set -euo pipefail
          approved_tag=fd2ceb1b949bab766e8fc316e5b4116dcf05d1b0
          repair_commit="$(git rev-parse HEAD^)"
          [[ "$(git rev-parse 'v0.2.0^{commit}')" == "$approved_tag" ]]
          [[ "$(git rev-parse "${repair_commit}^")" == "$approved_tag" ]]
          [[ "$(git diff --name-only "$approved_tag" "$repair_commit")" == scripts/build-packs.mjs ]]
          [[ "$(git diff --name-only "$repair_commit" HEAD)" == .github/workflows/release.yml ]]
      - name: Run the same test gate as local pre-release
        shell: bash
        run: bash tests/release-gate.sh
      - name: Compile native system compendiums
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build:packs
      - name: Validate manifest and package compiled system compendiums
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('.')
          manifest = json.loads((root / 'system.json').read_text(encoding='utf-8'))
          assert manifest['id'] == 'fast-nri-v14'
          assert manifest['download'].endswith(f"/v{manifest['version']}/fast-nri-v14.zip")
          files = [pathlib.Path('system.json')]
          files += [pathlib.Path(p) for p in manifest['esmodules']]
          files += [pathlib.Path(p) for p in manifest['styles']]
          files += [pathlib.Path(lang['path']) for lang in manifest['languages']]
          for pack in manifest['packs']:
              assert pack['type'] in ('Item','Actor') and pack['system'] == manifest['id']
              assert pack['path'] == 'packs/' + pack['name']
              entries = [p for p in pathlib.Path(pack['path']).rglob('*') if p.is_file()]
              assert entries, f"No built files in {pack['path']}"
              files += entries
          for folder in ('module','templates'):
              files += [p for p in pathlib.Path(folder).rglob('*') if p.is_file()]
          files = sorted(set(files))
          assert all(p.is_file() and '..' not in p.parts for p in files)
          pathlib.Path('dist').mkdir(exist_ok=True)
          with zipfile.ZipFile('dist/fast-nri-v14.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,'fast-nri-v14/'+p.as_posix())
          with zipfile.ZipFile('dist/fast-nri-v14.zip') as z:
              assert z.testzip() is None
          print(f"Packaged {len(files)} runtime files")
          PY
          sha256sum dist/fast-nri-v14.zip
      - name: Preserve the original installer, publish the correction and advance main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.2.0
          approved_tag=fd2ceb1b949bab766e8fc316e5b4116dcf05d1b0
          release_id=457223606
          original_id=788515480
          original_digest=sha256:09f2e3597df54636807e5f6ebebfb9066f567f7b7f48ec1a3fc2da2ca720ad15
          installer=fast-nri-v14.zip
          preserved=fast-nri-v14-original-empty-packs.zip
          repair_commit="$(git rev-parse HEAD^)"
          git fetch origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$approved_tag" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" == "$approved_tag" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/$tag" --jq .object.sha)" == "$approved_tag" ]]

          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --argjson release "$release_id" --argjson original "$original_id" \
            --arg name "$installer" --arg digest "$original_digest" --arg preserved "$preserved" \
            '.id == $release and .prerelease and (.draft | not) and
            ([.assets[] | select(.name == $name)] | length == 1) and
            (any(.assets[]; .name == $name and .id == $original and .digest == $digest and .state == "uploaded")) and
            (all(.assets[]; .name != $preserved))' <<< "$current"

          original_endpoint="repos/$GITHUB_REPOSITORY/releases/assets/$original_id"
          gh api --method PATCH "$original_endpoint" -f name="$preserved" \
            -f label='Первая сборка с пустыми компендиями (архив)' \
            --jq '.name + " " + .digest'
          gh release upload "$tag" "dist/$installer" --repo "$GITHUB_REPOSITORY"

          verify_dir="$(mktemp -d)"
          gh release download "$tag" --pattern "$installer" --dir "$verify_dir" --repo "$GITHUB_REPOSITORY"
          cmp "dist/$installer" "$verify_dir/$installer"
          digest="sha256:$(sha256sum "dist/$installer" | cut -d' ' -f1)"
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --argjson release "$release_id" --argjson original "$original_id" \
            --arg name "$installer" --arg digest "$digest" --arg preserved "$preserved" --arg old "$original_digest" \
            '.id == $release and .prerelease and (.draft | not) and
            (any(.assets[]; .name == $name and .id != $original and .digest == $digest and .state == "uploaded")) and
            (any(.assets[]; .name == $preserved and .id == $original and .digest == $old and .state == "uploaded"))' <<< "$current"
          git push origin "${repair_commit}:refs/heads/main"
