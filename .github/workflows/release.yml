name: Export exact working source (no publication)
on:
  create:
permissions:
  contents: read
jobs:
  export:
    if: github.event.ref_type == 'branch' && github.event.ref == 'checks/workspace-source-export-0.2.0.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive original development commit
        run: git archive --format=zip --output=fnri-source.zip ad2dd48cd4120e55fb74a03eb1bfe7132bc65f7a
      - uses: actions/upload-artifact@v4
        with:
          name: fnri-source-ad2dd48
          path: fnri-source.zip
          if-no-files-found: error
